name: Pull Request Testing

on:
    push:
        branches:
            - main
            - v*.*

    pull_request:
        branches:
            - main
            - v*.*

    workflow_dispatch:

jobs:
    QA:
        name: "Quality Assurance"
        runs-on: ubuntu-24.04

        permissions:
            contents: read

        strategy:
            max-parallel: 3
            matrix:
                tox-target: ["type", "lint", "format"]

        steps:
        - uses: actions/checkout@v6

        - name: Setup Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.12"
            cache: 'pip'

        - name: Prepare environment
          run: |
            python3 -m pip install --upgrade pip
            pip install tox

        - name: Tox check
          run: |
            tox run -e ${{ matrix.tox-target }}

    check:
        name: "Unit Testing"
        runs-on: ubuntu-24.04

        permissions:
          contents: read

        strategy:
            max-parallel: 3
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
                include:
                - python-version: "3.12"
                  coverage: true

        steps:
        - uses: actions/checkout@v6

        - name: Setup Python ${{matrix.python-version}}
          uses: actions/setup-python@v6
          with:
            python-version: ${{matrix.python-version}}
            cache: 'pip'

        - name: Prepare environment
          run: |
            python3 -m pip install --upgrade pip
            pip install tox

        - name: Unit testing
          run: |
            tox run -e ${{matrix.python-version}}${{matrix.coverage && '-coverage' || ''}}

        - name: Upload unit test coverage
          if: matrix.coverage
          uses: actions/upload-artifact@v7
          with:
            path: ./coverage.xml
            archive: false
