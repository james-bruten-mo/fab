# Updating the pull request is split into this separate workflow in order to
# ensure that no code from the repository is run (e.g. by pytest or mypy)
# under the elevated permissions which allow writing to the target repository
# or access to its secrets.
#
name: Pull Request Publish

on:
  workflow_run:
    workflows:
      - Pull Request Testing
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-24.04

    if: github.event.workflow_run.event == 'pull_request'

    permissions:
      issues: write

    steps:
      - name: Download unit test coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage.json

      - name: Publish unit test coverage
        uses: actions/github-script@v9
        with:
          script: |
            // Process PyTest coverage summary file into comment for
            // pull request.

            var work = []
            const report = require('./coverage.json')
            for (const filename in report.files) {
                work.push(
                    {
                        filename: filename,
                        coverage_value: report.files[filename].summary.percent_covered,
                        coverage_display: report.files[filename].summary.percent_covered_display
                    }
                );
            }
            const results = work.sort((a, b) => a.coverage_value - b.coverage_value);
            const underNinety = results.filter((a) => a.coverage_value < 90.0)
            const overNinety = results.filter((a) => a.coverage_value >= 90.0)

            const header = "<!-- UNIT TEST COVERAGE -->\n"
            var body = header + "\n"
            body += "## Unit Test Coverage\n\n"
            body += "| Coverage (%) | Source File |\n"
            body += "|--------------|-------------|\n"

            for (const index in underNinety) {
                body += `| ${underNinety[index].coverage_display.padStart(3, ' ')} | ${underNinety[index].filename} |\n`
            }

            if (overNinety) {
                body += "<details>\n"
                body += "<summary>Coverage over 90%</summary>\n\n"
                body += "| Coverage (%) | Source File |\n"
                body += "|--------------|-------------|\n"
                for (const index in overNinety) {
                    body += `| ${overNinety[index].coverage_display.padStart(3, ' ')} | ${overNinety[index].filename} |\n`
                }
                body += "</details>\n"
            }

            // Find and delete any previous comments.

            const comment_promise = await github.rest.issues.listComments(
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number
                }
            )
            await Promise.all(
                comment_promise.data.filter(
                    comment => comment.body?.startsWith(header)
                ).map(
                    comment => github.rest.issues.deleteComment(
                        {
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.issue.number,
                            comment_id: comment.id
                        }
                    )
                )
            )

            // Create a comment attached to the current commit.

            await github.rest.issues.createComment(
              {owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: context.issue.number,
               body: body}
            )
