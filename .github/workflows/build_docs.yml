name: Build Docs

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build-html:

    name: HTML Documentation
    runs-on: ubuntu-24.04

    steps:

      - id: extract
        name: Extract
        uses: actions/checkout@v6

      - id: setup_environment
        name: Setup Python environment
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - id: finesse_environment
        name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install .[doc]

      - id: sphinx
        name: Run Sphinx
        working-directory: ./documentation/fabengine
        # Run Sphinx to build the HTML documentation with warnings treated as
        # errors and continue on warnings. The '-n' option runs in nit-picky
        # mode to warn about all references where the target cannot be found.
        run: make html SPHINXOPTS="-W --keep-going -n"

      - id: permissions
        name: Set permissions
        run: |
          chmod -c -R +rX "documentation/fabengine/_build/html/"

      - id: upload_artefact
        name: Upload Artifact
        if: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && github.ref_name == 'main'}}
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: documentation/fabengine/_build/html
          retention-days: 1

      - id: deploy_pages
        name: Deploy pages
        if: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && github.ref_name == 'main'}}
        uses: actions/deploy-pages@v4
