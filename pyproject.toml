[build-system]
requires = ["setuptools >= 80.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'fabengine'
requires-python = '>=3.10'
dynamic = ["version"]
dependencies = ['rich', 'setproctitle', 'PyYAML', 'tree-sitter', 'tree-sitter-fortran', 'tree-sitter-c']

[project.scripts]
fabtoy = "fabengine.entry:cli"

[project.optional-dependencies]
test = [
    'pytest >= 9.0.3',
    'pytest-cov >= 7.1.0',
    'pytest-subprocess >= 1.6.0',
    'mypy >= 2.1.0',
    'ruff>=0.15.13',
    'types-PyYAML'
]
doc = [
    'pydata_sphinx_theme == 0.19.0',
    'sphinx == 9.1.0',  # Peg Sphinx to version which works with theme
    'sphinxcontrib_mermaid == 2.0.2',
    'sphinx_design == 0.7.0',
    'matplotlib',
    'numpy',
    'rich'
]

[tool.setuptools.dynamic]
version = {attr = 'fabengine.__version__'}

[tool.setuptools.packages.find]
where = ['source']

[tool.setuptools.package-data]
"fabengine.data" = ["*.yaml"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = '--ignore=test/fabengine/development'

[tool.coverage.run]
omit = [
    # Omit build scripts created on tmp_path
    "*/tmp/pytest*/*",
    ]

[tool.tox]
requires = ["tox>=4.19"]
env_list = [
    { product = [["3.12", "3.13", "3.14", "3.15"], ["coverage"]]},
    "type", "lint", "format",
]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
deps = [
    "pytest>=8",
    { replace = "if", condition = "factor.coverage", then = ["pytest-cov >= 7.1.0"], extend = true},
    "pytest-subprocess >= 1.6.0",
    "rich", "setproctitle", "pyyaml",
    "tree-sitter", "tree-sitter-fortran",
]
commands = [
    [
        "pytest", "-W", "ignore::DeprecationWarning",
        { replace = "if", condition = "factor.coverage", then = ["--cov=.", "--cov-report=xml"], extend = true},
        {replace = "posargs", extend = true},
    ]
]

[tool.tox.env.type]
description = "run type check on code base"
deps = ["mypy>=1.18", "pytest>=8", "pytest-subprocess >= 1.6.0", "types-PyYAML"]
commands = [["mypy", "source/fabengine", "tests/fabengine/unit_test"]]

[tool.tox.env.lint]
description = "run ruff lint check on code base"
deps = ["ruff>=0.14"]
commands = [["ruff", "check", {replace = "posargs", extend = true}, "source/fabengine", "tests/fabengine/unit_test"]]

[tool.tox.env.format]
description = "run ruff format check on code base"
deps = ["ruff>=0.14"]
commands = [["ruff", "format", {replace = "posargs", default = ["--check"], extend = true}, "source/fabengine", "tests/fabengine/unit_test"]]

[tool.tox.env.docs]
description = "build documentation"
deps = ['pydata_sphinx_theme == 0.16.1',
        'sphinx == 9.0.4',  # Peg Sphinx to version which works with theme
        'sphinxcontrib_mermaid',
        'matplotlib',
        'numpy',
        'rich']
allowlist_externals = ["/bin/cp", "/bin/rm", "/usr/bin/mkdir", "/usr/bin/make"]
commands = [
    ["/bin/rm", "-Rf", "{env_tmp_dir}/documentation/fabengine", "{env_tmp_dir}/_build"],
    ["mkdir", "{env_tmp_dir}/documentation"],
    ["/bin/cp", "-a", "{tox_root}/documentation/fabengine", "{env_tmp_dir}/documentation/fabengine"],
    ["/usr/bin/make", "-f", "{env_tmp_dir}/documentation/fabengine/Makefile",
     "SOURCEDIR={env_tmp_dir}/documentation/fabengine", "BUILDDIR={env_tmp_dir}/_build",
     "CODEDIR={tox_root}/source/fabengine", "html"],
]

[tool.tox.env.development]
description = "run LFRic development test cases"
change_dir = "test/fabengine/development"
interrupt_timeout = 30
allowlist_externals = ["/bin/sh", "/bin/rm"]
commands = [
    ["/bin/rm", "-Rf", "work"],
    ["/bin/sh", "-l", "run",
     {replace = "posargs", default = ["-v", "-j", "4", "--fabfile", "skeleton.fabfile"], extend = true}]]
